name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install application toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Business tests
        run: cargo test --locked
      - name: Run the demo
        run: cargo run --locked

  architecture:
    name: cargo-pup rules and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test harness toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Install pinned cargo-pup
        run: bash scripts/install-pup.sh
      - name: Inspect matched modules
        run: cargo pup print-modules
      - name: Check the real application
        run: cargo pup
      - name: Verify violations and known gaps
        run: cargo test --locked --test architecture -- --ignored --nocapture --test-threads=1
