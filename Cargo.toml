[package]
name = "cargo-pup-clean-architecture-example"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "An executable Clean Architecture example with cargo-pup regression tests"

[lib]
name = "clean_architecture"

[[bin]]
name = "task-demo"
path = "src/main.rs"

[features]
# Explicit opt-in: ordinary behavior tests do not require the external lint tool.
architecture-tests = []

[[test]]
name = "architecture"
path = "tests/architecture.rs"
required-features = ["architecture-tests"]

# Both the application and the Rust test harness are dependency-free.
